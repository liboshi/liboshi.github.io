# ---------------------------------------------------------------------------
# 站点元信息
# ---------------------------------------------------------------------------
title: Boush Li
description: >-
  Boush Li 的个人主页与技术博客——编程语言、构建系统、编辑器与日常工具的笔记。
author:
  name: Boush Li
  github: liboshi
  bio: 软件工程师 · 记录代码、工具与系统
  avatar: /images/liboshi_logo_red_icon.png
lang: zh-CN
url: https://liboshi.github.io
baseurl: ""

# ---------------------------------------------------------------------------
# 构建
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge
permalink: /:year/:month/:day/:title.html
timezone: Asia/Shanghai
safe: false

# 文章默认使用 post 布局（文章 front matter 可覆盖）
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - preview
  - docs
  - node_modules
