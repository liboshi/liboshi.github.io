# ---------------------------------------------------------------------------
# 站点元信息
# ---------------------------------------------------------------------------
title: Boush Li
tagline: 代码、工具与系统
description: >-
  Boush Li 的个人主页与技术博客：记录编程语言、构建系统、编辑器，以及日常工作中反复使用的工具。
author:
  name: Boush Li
  github: liboshi
  url: https://github.com/liboshi
  bluesky: liboshi.bsky.social
  bio: 软件工程师 · 记录代码、工具与系统
  avatar: /images/avatar-400.png
og_image: /images/og-cover.png
lang: zh-CN
url: https://liboshi.github.io
baseurl: ""

# ---------------------------------------------------------------------------
# 构建
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge
permalink: /:year/:month/:day/:title.html
timezone: Asia/Shanghai
safe: false

# 文章默认使用 post 布局（文章 front matter 可覆盖）
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - preview
  - docs
  - node_modules
