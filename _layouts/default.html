<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    {% include head.html %}
  </head>
  <body{% if page.url == '/404.html' %} class="page-404"{% endif %}>
    <a class="skip-link" href="#main">跳到主要内容</a>

    {% include header.html %}

    <main id="main" class="site-main">
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
