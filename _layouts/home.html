---
layout: default
---

<div class="container">
  {% include profile.html %}

  <div class="layout-grid">
    <section class="feed" id="latest-posts" aria-labelledby="feed-title">
  <div class="feed__head">
    <h2 class="feed__title" id="feed-title">最新文章</h2>
    <span class="feed__count">{{ site.posts | size }} 篇</span>
  </div>

  <div class="feed__tools">
    <label class="search" for="post-search">
      <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.2-3.2"/>
      </svg>
      <span class="sr-only">搜索文章</span>
      <input class="search__input" id="post-search" type="search"
             placeholder="搜索标题、摘要或标签…" autocomplete="off"
             data-post-search>
    </label>
    <p class="feed__status" data-post-search-status aria-live="polite">{{ site.posts | size }} 篇文章</p>
  </div>

  <p class="feed__empty" data-post-search-empty hidden>没有找到匹配的文章，换个关键词试试。</p>

      {{ content }}
    </section>

    {% include rail.html %}
  </div>
</div>
