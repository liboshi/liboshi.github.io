<footer class="footer">
  <div class="footer__inner">
    <a class="footer__brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — 首页">
      <span class="brand__mark brand__mark--sm" aria-hidden="true">B</span>
      <span>{{ site.title }}</span>
    </a>

    <nav class="footer__nav" aria-label="页脚导航">
      {%- for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}">{{ item.label }}</a>
      {%- endfor %}
      <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://bsky.app/profile/{{ site.author.bluesky }}" target="_blank" rel="me noopener noreferrer">Bluesky</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>

    <p class="footer__note">
      © {{ site.time | date: '%Y' }} {{ site.author.name }}
      <span aria-hidden="true">·</span>
      使用 Jekyll 构建
      <span aria-hidden="true">·</span>
      <a href="{{ '/feed.xml' | relative_url }}">Atom 订阅</a>
    </p>
  </div>
</footer>
