<footer class="site-foot">
  <div class="site-foot__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="wordmark__mark" aria-hidden="true">B</span>
      <span>{{ site.title }}</span>
    </a>

    <nav class="site-foot__nav" aria-label="页脚导航">
      {%- for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}">{{ item.label }}</a>
      {%- endfor %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </nav>

    <p class="site-foot__note">© {{ site.time | date: '%Y' }} {{ site.author.name }} · Built with Jekyll</p>
  </div>
</footer>
