{%- assign active_tab = include.active | default: 'home' %}
<section class="profile card" aria-labelledby="profile-name">
  <div class="profile__cover" aria-hidden="true"></div>

  <div class="profile__body">
    <img class="profile__avatar"
         src="{{ site.author.avatar | relative_url }}"
         alt="{{ site.author.name }}" width="168" height="168">

    <div class="profile__info">
      <h1 class="profile__name" id="profile-name">{{ site.author.name }}</h1>
      <p class="profile__bio">{{ site.author.bio }}</p>
      <ul class="profile__meta">
        <li>
          <svg class="icon icon--xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.7A5.2 5.2 0 0 0 19.1 5a4.9 4.9 0 0 0-.1-3.6s-1.1-.3-3.7 1.4a12.7 12.7 0 0 0-6.6 0C6.1 1.1 5 1.4 5 1.4A4.9 4.9 0 0 0 4.9 5a5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.2 6.4 6.2 6.7a3.4 3.4 0 0 0-.9 2.6V22"/>
          </svg>
          <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer">github.com/{{ site.author.github }}</a>
        </li>
        <li>
          <svg class="icon icon--xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Z"/>
            <path d="M8 7h8M8 11h6"/>
          </svg>
          {{ site.posts | size }} posts since {{ site.posts.last.date | date: '%Y' }}
        </li>
      </ul>
    </div>

    <div class="profile__actions">
      <a class="btn btn--primary" href="#latest-posts">Latest posts</a>
      <a class="btn btn--secondary" href="{{ '/posts/' | relative_url }}">Browse archive</a>
      <a class="btn btn--ghost" href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </div>

  <nav class="tabs" aria-label="Sections">
    <a class="tab{% if active_tab == 'home' %} is-active{% endif %}"
       href="{{ '/' | relative_url }}"
       {%- if active_tab == 'home' %} aria-current="page"{% endif %}>Posts</a>
    <a class="tab{% if active_tab == 'archive' %} is-active{% endif %}"
       href="{{ '/posts/' | relative_url }}"
       {%- if active_tab == 'archive' %} aria-current="page"{% endif %}>Archive</a>
    <a class="tab{% if active_tab == 'about' %} is-active{% endif %}"
       href="{{ '/about/' | relative_url }}"
       {%- if active_tab == 'about' %} aria-current="page"{% endif %}>About</a>
  </nav>
</section>
