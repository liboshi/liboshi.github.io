<article class="card profile" aria-labelledby="profile-name">
  <div class="profile__cover" aria-hidden="true"></div>
  <div class="profile__body">
    <img class="avatar avatar--xl profile__avatar"
         src="{{ '/images/avatar-192.png' | relative_url }}"
         srcset="{{ '/images/avatar-192.png' | relative_url }} 1x, {{ '/images/avatar-400.png' | relative_url }} 2x"
         sizes="168px" width="168" height="168"
         alt="{{ site.author.name }}" fetchpriority="high" decoding="async">
    <div class="profile__info">
      <h1 class="profile__name" id="profile-name">{{ site.author.name }}</h1>
    <p class="profile__bio">{{ site.author.bio }}</p>
    <p class="profile__meta">
      <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer">
        <svg class="icon icon--xs" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5A11.5 11.5 0 0 0 .5 12.3c0 5.2 3.3 9.6 7.9 11.1.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.4-1.3-1.8-1.3-1.8-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.8 2.7 1.3 3.3 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.7.8 1.2 1.9 1.2 3.2 0 4.6-2.7 5.6-5.3 5.9.4.3.7 1 .7 2v3c0 .3.2.7.8.6a11.5 11.5 0 0 0 7.9-11.1A11.5 11.5 0 0 0 12 .5Z"/>
        </svg>
        @{{ site.author.github }}
      </a>
      <span aria-hidden="true">·</span>
      <a href="https://bsky.app/profile/{{ site.author.bluesky }}" target="_blank" rel="me noopener noreferrer">
        <svg class="icon icon--xs" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 10.8c-1.087-2.114-4.046-6.053-6.798-7.995C2.566.944 1.561 1.266.902 1.565.139 1.908 0 3.08 0 3.768c0 .69.378 5.65.624 6.479.815 2.736 3.713 3.66 6.383 3.364.136-.02.275-.039.415-.056-.138.022-.276.04-.415.056-3.912.58-7.387 2.005-2.83 7.078 5.013 5.19 6.87-1.113 7.823-4.308.953 3.195 2.81 9.498 7.823 4.308 4.557-5.073 1.082-6.498-2.83-7.078a8.741 8.741 0 0 1-.415-.056c.14.017.279.036.415.056 2.67.297 5.568-.628 6.383-3.364.246-.828.624-5.79.624-6.478 0-.69-.139-1.861-.902-2.206-.659-.298-1.664-.62-4.3 1.24C16.046 4.748 13.087 8.687 12 10.8Z"/>
        </svg>
        @{{ site.author.bluesky }}
      </a>
      <span aria-hidden="true">·</span>
      <span>{{ site.posts | size }} 篇文章 · {{ site.posts.last.date | date: '%Y' }} 年至今</span>
    </p>
      <div class="profile__actions">
      <a class="btn btn--primary" href="#latest-posts">最新文章</a>
      <a class="btn" href="{{ '/posts/' | relative_url }}">浏览归档</a>
      </div>
    </div>
  </div>
  <div class="tabs profile__tabs" role="navigation" aria-label="内容导航">
    <a class="tab is-active" href="#latest-posts" aria-current="page">文章</a>
    <a class="tab" href="{{ '/posts/' | relative_url }}">归档</a>
    <a class="tab" href="{{ '/tags/' | relative_url }}">标签</a>
    <a class="tab" href="{{ '/about/' | relative_url }}">关于</a>
  </div>
</article>
