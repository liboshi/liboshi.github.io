<aside class="rail" aria-label="侧栏">
  <section class="card rail__card" aria-labelledby="rail-links-title">
    <h2 class="rail__title" id="rail-links-title">快速入口</h2>
    <ul class="rail__links">
      <li>
        <a class="rail__link" href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer">
          <span>GitHub</span>
          <svg class="icon icon--xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7M7 7h10v10"/>
          </svg>
        </a>
      </li>
      <li>
        <a class="rail__link" href="{{ '/posts/' | relative_url }}">
          <span>文章归档</span>
          <span class="rail__hint">按年份</span>
        </a>
      </li>
      <li>
        <a class="rail__link" href="{{ '/feed.xml' | relative_url }}">
          <span>Atom 订阅</span>
          <span class="rail__hint">RSS</span>
        </a>
      </li>
    </ul>
  </section>

  <section class="card rail__card" aria-labelledby="rail-about-title">
    <h2 class="rail__title" id="rail-about-title">关于本站</h2>
    <p>这里是我的中文技术笔记：记录编程语言、构建系统、编辑器，以及日常工作中反复使用的工具。也保留了一些英文文章。</p>
    <p>内容用 Markdown 写作，Jekyll 生成静态页面，没有评论、统计脚本和第三方追踪。</p>
    <a class="rail__more" href="{{ '/about/' | relative_url }}">
      关于我
      <svg class="icon icon--xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </a>
  </section>
</aside>
