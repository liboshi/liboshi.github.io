<form class="search" role="search">
  <label class="visually-hidden" for="{{ include.id }}">搜索文章</label>
  <div class="search__field">
    <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5"/>
      <path d="M16 16l4.5 4.5"/>
    </svg>
    <input id="{{ include.id }}" type="search" name="q" autocomplete="off"
           placeholder="搜索标题、摘要或标签…" data-search-input>
    {%- unless include.hide_hint %}
    <kbd class="search__hint" aria-hidden="true">/</kbd>
    {%- endunless %}
  </div>
</form>
